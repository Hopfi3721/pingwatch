services:
  pingwatch:
    build: .
    image: pingwatch:0.1
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DB_PATH: "/data/pingwatch.db"
      WORKERS: "8"
      FAILURE_THRESHOLD: "3"
      RESULTS_RETENTION: "5000"
      # Подхватываются из .env рядом с compose-файлом; пустые = только лог.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    volumes:
      - pingwatch-data:/data

volumes:
  pingwatch-data:
